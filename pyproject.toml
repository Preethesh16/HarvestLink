[project]
name = "harvestlink"
version = "0.1.0"
description = "Farmer-first procurement with bounded negotiation and expiry-aware forecasting"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
]
[project.optional-dependencies]
demo = ["websockets>=15,<18"]
forecast = ["chronos-forecasting>=2.0,<3", "torch>=2.2"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
